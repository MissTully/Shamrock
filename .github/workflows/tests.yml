name: Tests

on:
  push:
  pull_request:

# Cancel an in-progress run when the same branch or pull request is pushed
# again, so a burst of commits does not stack full Playwright suites.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static check and browser tests
        run: npm test
      - name: Roles access rules
        run: node --test roles-access-rules.test.mjs
