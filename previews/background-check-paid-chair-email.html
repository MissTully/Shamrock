<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sample: chair alert when the background check is paid</title>
<style>
  body{margin:0;padding:24px 12px 48px;background:#f6efdd;font-family:Georgia,"Times New Roman",serif;color:#23291f;}
  .note{max-width:640px;margin:0 auto 16px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;color:#3a3a2e;}
  .sheet{max-width:640px;margin:0 auto;background:#fff;border:1px solid #ecd07e;border-radius:12px;padding:28px 26px;font-size:16px;line-height:1.65;}
  h1{margin:0 0 16px;font-size:22px;color:#14532d;}
  p{margin:0 0 12px;}
  a.pay{display:inline-block;background:#14532d;color:#fff;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:700;margin:8px 0 18px;}
</style>
</head>
<body>
<p class="note">Sample only. This note is not sent. The name is fictional. The live letter goes to the Membership Chair when a new applicant pays the background check fee. Backfill and migration do not send it.</p>
<article class="sheet" id="emailBody">
  <h1>Background check paid</h1>
  <p>Alex Quinn paid the $75 background check fee.</p>
  <p><a class="pay" href="https://www.kreweofshamrock.com/members.html#applications">Open Membership Applications</a></p>
</article>
</body>
</html>
