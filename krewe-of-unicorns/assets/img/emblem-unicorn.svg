<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Krewe of Unicorns crest">
  <defs>
    <radialGradient id="field" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2a0a52"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe694"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#c9971a"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9971a"/>
      <stop offset="0.5" stop-color="#ffe694"/>
      <stop offset="1" stop-color="#fff6d8"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.35" stop-color="#ec4899"/>
      <stop offset="0.62" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mane2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe6ff"/>
    </linearGradient>
  </defs>

  <!-- roundel -->
  <circle cx="100" cy="100" r="97" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="88" fill="url(#field)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f5c542" stroke-width="1.2" opacity="0.45"/>

  <!-- scattered stars -->
  <g fill="#ffe694">
    <path d="M44 62 l2.2 5.4 5.8 .5 -4.4 3.8 1.4 5.7 -5-3.1 -5 3.1 1.4-5.7 -4.4-3.8 5.8-.5z" opacity="0.9"/>
    <path d="M150 132 l1.7 4.2 4.6 .4 -3.5 3 1.1 4.5 -3.9-2.4 -3.9 2.4 1.1-4.5 -3.5-3 4.6-.4z" opacity="0.75"/>
    <circle cx="150" cy="66" r="2.1" opacity="0.8"/>
    <circle cx="54" cy="140" r="1.9" opacity="0.7"/>
  </g>

  <!-- flowing rainbow mane (behind the head, down the back of the neck) -->
  <path d="M118 70
           C 150 74 160 108 150 146
           C 146 128 138 116 126 112
           C 140 126 138 150 122 168
           C 122 146 116 126 104 120
           C 118 132 116 152 104 166
           C 106 144 100 122 96 112 Z" fill="url(#mane)"/>
  <path d="M112 66
           C 138 70 146 98 138 128
           C 134 112 128 104 118 102
           C 128 114 126 134 114 150
           C 116 130 110 114 100 110 Z" fill="url(#mane2)" opacity="0.9"/>

  <!-- forelock falling between horn and ear over the brow -->
  <path d="M96 78 C 108 84 108 98 98 108 C 104 96 100 86 92 84 Z" fill="url(#mane)" opacity="0.95"/>

  <!-- UNICORN HEAD (left-facing profile), white -->
  <path d="M50 120
           C 46 112 50 103 60 98
           C 68 93 76 88 84 83
           C 89 80 93 79 97 79
           C 106 80 113 86 118 97
           C 124 110 126 132 123 153
           C 121 165 119 172 116 178
           L 96 178
           C 93 168 90 157 88 148
           C 86 139 82 132 73 128
           C 66 125 58 124 52 122 Z"
        fill="url(#face)" stroke="#d9c7ff" stroke-width="1"/>

  <!-- ear -->
  <path d="M101 80 C 106 70 112 60 119 54 C 118 66 116 78 111 88 C 108 84 104 82 101 80 Z"
        fill="url(#face)" stroke="#d9c7ff" stroke-width="0.8"/>
  <path d="M105 78 C 108 71 112 65 116 61 C 115 69 113 77 110 83 C 108 81 106 79 105 78 Z"
        fill="#e9d5ff"/>

  <!-- golden spiral horn -->
  <path d="M84 82 L104 20 L94 84 Z" fill="url(#horn)" stroke="#c9971a" stroke-width="1.2"/>
  <g stroke="#c9971a" stroke-width="1.1" opacity="0.65" fill="none">
    <path d="M89 74 L97 71"/>
    <path d="M90 64 L98 61"/>
    <path d="M92 52 L99 50"/>
    <path d="M95 40 L100 39"/>
    <path d="M97 30 L101 30"/>
  </g>
  <!-- horn tip sparkle -->
  <path d="M104 16 l1.4 3.6 3.8 .3 -2.9 2.4 .9 3.7 -3.2-2 -3.2 2 .9-3.7 -2.9-2.4 3.8-.3z" fill="#fff6d8"/>

  <!-- eye + nostril -->
  <circle cx="74" cy="106" r="3.4" fill="#2a0a52"/>
  <circle cx="75.2" cy="104.8" r="1.1" fill="#fff"/>
  <path d="M55 116 C 53 115 52 117 54 118 C 56 119 57 117 55 116 Z" fill="#4c1d95"/>
</svg>
