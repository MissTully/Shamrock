<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="assets/img/logo-unicorn.png" />
<title>Krewe of Unicorns · Raffle QR Codes</title>
<link rel="stylesheet" href="assets/krewe.css" />
<style>
  body{ background:#fff; }
  .qr-top{ max-width:900px; margin:0 auto; padding:20px; text-align:center; }
  .qr-top .emblem{ width:66px; height:66px; margin:0 auto 6px; display:block; }
  .qr-top h1{ font-family:var(--display); color:var(--green-800); }
  .qr-actions{ margin:10px 0 18px; }
  .qr-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px; max-width:900px; margin:0 auto; padding:0 20px 40px; }
  .qr-card{ border:2px solid var(--green-800); border-radius:16px; padding:18px; text-align:center; break-inside:avoid; }
  .qr-card h2{ font-family:var(--display); color:var(--green-800); font-size:22px; margin:0 0 4px; }
  .qr-card .sub{ color:#6d28d9; font-size:14px; margin:0 0 10px; }
  .qr-ph{ width:230px; height:230px; margin:0 auto; border:2px dashed var(--green-800); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:
      linear-gradient(135deg, rgba(76,29,149,.06), rgba(212,175,55,.06)); color:var(--green-800); }
  .qr-ph .qic{ font-size:52px; line-height:1; }
  .qr-ph .qtxt{ font-family:var(--display); font-size:13px; letter-spacing:.5px; }
  .qr-card .scan{ font-family:var(--display); color:var(--green-800); margin-top:8px; font-size:15px; }
  .qr-card.fifty{ border-color:#6d28d9; }
  .qr-card.fifty .qr-ph{ border-color:#6d28d9; }
  @media print{ .qr-actions,.krewe-nav,.krewe-music{ display:none !important; } .qr-card{ box-shadow:none; } }
</style>
</head>
<body>
  <div class="qr-top">
    <img class="emblem" src="assets/img/logo-unicorn.png" alt="Krewe of Unicorns emblem" />
    <h1>Krewe of Unicorns Raffle QR Codes</h1>
    <p>Print this page, cut out each card, and tape it to the matching basket. Guests scan to enter from their phones. ✨</p>
    <div class="qr-actions"><button class="btn btn-primary" onclick="window.print()">🖨️ Print</button> <a class="btn" href="members.html">← Back to Members</a></div>
  </div>
  <div id="qrGrid" class="qr-grid"><p style="text-align:center;grid-column:1/-1;">Loading…</p></div>

  <!-- RAFFLE QR DATA (demo: baked-in, no network; placeholder QR boxes) -->
  <script>
    const E=(s)=>(s??"").toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
    const grid=document.getElementById('qrGrid');

    // Baked-in sample raffle (matches raffle.html)
    const BASKETS = [
      { id:"golden-horn",   name:"The Golden Horn Trophy", estimated_value:250 },
      { id:"rainbow-basket",name:"Rainbow Gift Basket",     estimated_value:120 },
      { id:"enchanted-spa", name:"Enchanted Spa Escape",    estimated_value:180 },
      { id:"family-magic",  name:"Family Magic Night",      estimated_value:90  },
    ];
    const POT = { id:"fifty-2027", name:"50/50 Cash Raffle" };

    function card(title, sub, cls){
      const d=document.createElement('div'); d.className='qr-card'+(cls?' '+cls:'');
      d.innerHTML='<h2>'+E(title)+'</h2><div class="sub">'+E(sub)+'</div>'+
        '<div class="qr-ph" role="img" aria-label="Placeholder QR code"><span class="qic">🦄</span><span class="qtxt">QR CODE</span></div>'+
        '<div class="scan">📷 Scan to enter</div>';
      grid.appendChild(d);
    }
    (function(){
      grid.innerHTML='';
      for(const b of BASKETS){ card(b.name, 'Basket Raffle'+(b.estimated_value?' · ~$'+b.estimated_value:''), ''); }
      card(POT.name, 'Winner takes half the pot', 'fifty');
      if(!grid.children.length){ grid.innerHTML='<p style="text-align:center;grid-column:1/-1;">No baskets to show yet.</p>'; }
    })();
  </script>
</body>
</html>
