<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Krewe of Shamrock crest, established 1999">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcefb4"/>
      <stop offset="0.45" stop-color="#e7c358"/>
      <stop offset="0.75" stop-color="#c69a2e"/>
      <stop offset="1" stop-color="#8a6512"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#e3bf57"/>
    </linearGradient>
    <radialGradient id="ringDark" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#13502c"/>
      <stop offset="1" stop-color="#062313"/>
    </radialGradient>
    <radialGradient id="field" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#23824a"/>
      <stop offset="0.7" stop-color="#136234"/>
      <stop offset="1" stop-color="#0a3d20"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd79a"/>
      <stop offset="0.5" stop-color="#3aa55f"/>
      <stop offset="1" stop-color="#15662f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <path id="arcTop" fill="none" d="M 52,256 A 204,204 0 0 1 460,256"/>
    <path id="arcBot" fill="none" d="M 56,256 A 200,200 0 0 0 456,256"/>
  </defs>

  <!-- rim & bands -->
  <circle cx="256" cy="256" r="252" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="240" fill="url(#ringDark)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="256" cy="256" r="172" fill="url(#field)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="2"/>

  <!-- curved lettering -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#goldText)">
    <text font-size="37" letter-spacing="3.5" text-anchor="middle">
      <textPath href="#arcTop" startOffset="50%">KREWE OF SHAMROCK</textPath>
    </text>
    <text font-size="30" letter-spacing="5" text-anchor="middle">
      <textPath href="#arcBot" startOffset="50%">TAMPA BAY · EST. 1999</textPath>
    </text>
  </g>

  <!-- side ornaments (3 & 9 o'clock) -->
  <g fill="url(#gold)">
    <path d="M52,256 l13,-13 l13,13 l-13,13 z"/>
    <path d="M460,256 l-13,-13 l-13,13 l13,13 z"/>
  </g>

  <!-- shamrock -->
  <g filter="url(#soft)">
    <!-- stem -->
    <path d="M256,300 C250,330 244,352 236,372 C246,366 252,372 256,380 C260,372 266,366 276,372 C268,352 262,330 256,300 Z"
          fill="url(#leaf)" stroke="#0c4a26" stroke-width="2"/>
    <g stroke="#0c4a26" stroke-width="3">
      <!-- top leaf -->
      <path d="M256,150 C300,118 356,150 350,196 C346,228 312,244 280,240 C268,238 258,232 256,222 C254,232 244,238 232,240 C200,244 166,228 162,196 C156,150 212,118 256,150 Z" fill="url(#leaf)" opacity="0"/>
      <circle cx="256" cy="196" r="54" fill="url(#leaf)"/>
      <!-- bottom-left leaf -->
      <circle cx="206" cy="276" r="54" fill="url(#leaf)"/>
      <!-- bottom-right leaf -->
      <circle cx="306" cy="276" r="54" fill="url(#leaf)"/>
    </g>
    <!-- leaf highlights -->
    <g fill="#ffffff" opacity="0.28">
      <ellipse cx="242" cy="180" rx="16" ry="11" transform="rotate(-25 242 180)"/>
      <ellipse cx="192" cy="260" rx="16" ry="11" transform="rotate(-25 192 260)"/>
      <ellipse cx="292" cy="260" rx="16" ry="11" transform="rotate(-25 292 260)"/>
    </g>
    <!-- gold veins -->
    <g stroke="#d9b24b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M256,236 L256,200"/>
      <path d="M236,266 L210,250"/>
      <path d="M276,266 L302,250"/>
    </g>
  </g>
</svg