<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1d6e3d"/><stop offset="0.7" stop-color="#0f5128"/><stop offset="1" stop-color="#072a15"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeaa6"/><stop offset="0.5" stop-color="#e3bf57"/><stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="16" y="16" width="568" height="568" rx="14" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <g transform="translate(300,300)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- interlaced eternity rings -->
    <g stroke="#062a14" stroke-width="30">
      <circle cx="-60" cy="0" r="96"/><circle cx="60" cy="0" r="96"/>
    </g>
    <circle cx="-60" cy="0" r="96" stroke="url(#gold)" stroke-width="20"/>
    <circle cx="60" cy="0" r="96" stroke="url(#gold)" stroke-width="20"/>
    <!-- weave: redraw the right ring's left arc over the left ring -->
    <path d="M60,-96 A96,96 0 0 0 -36,0" stroke="#062a14" stroke-width="30"/>
    <path d="M60,-96 A96,96 0 0 0 -36,0" stroke="url(#gold)" stroke-width="20"/>
    <!-- central heart -->
    <g transform="translate(0,4)">
      <path d="M0,46 C -54,2 -34,-58 0,-26 C 34,-58 54,2 0,46 Z" fill="url(#gold)" stroke="#062a14" stroke-width="6"/>
      <path d="M0,46 C -54,2 -34,-58 0,-26 C 34,-58 54,2 0,46 Z" fill="none" stroke="#fff6da" stroke-width="2.5" opacity="0.5"/>
    </g>
    <!-- ring highlights -->
    <g stroke="#fff6da" stroke-width="3" opacity="0.45">
      <circle cx="-60" cy="0" r="96"/><circle cx="60" cy="0" r="96"/>
    </g>
  </g>
</svg>
